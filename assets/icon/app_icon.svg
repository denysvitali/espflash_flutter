<?xml version="1.0" encoding="utf-8"?>
<!-- espflasher launcher icon — legacy full-bleed version (pre-API-26 launchers).
     Same chip+bolt art as app_icon_foreground.svg on a rounded-square background
     with faint circuit traces. Background color matches ic_launcher_background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#262C4A"/>
      <stop offset="1" stop-color="#14172B"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#49527A"/>
      <stop offset="1" stop-color="#333A58"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="108" height="108" rx="20" fill="url(#bg)"/>

  <!-- circuit traces -->
  <g stroke="#3D4670" stroke-width="1.6" fill="none" opacity="0.55"
     stroke-linecap="round">
    <path d="M26 41 H14 V31"/>
    <path d="M26 67 H10"/>
    <path d="M82 41 H94 V51"/>
    <path d="M82 67 H98"/>
  </g>
  <g fill="#3D4670" opacity="0.55">
    <circle cx="14" cy="31" r="2.2"/>
    <circle cx="10" cy="67" r="2.2"/>
    <circle cx="94" cy="51" r="2.2"/>
    <circle cx="98" cy="67" r="2.2"/>
  </g>

  <!-- chip pins -->
  <g fill="#9AA3C4">
    <rect x="27" y="39" width="6" height="4" rx="1"/>
    <rect x="27" y="52" width="6" height="4" rx="1"/>
    <rect x="27" y="65" width="6" height="4" rx="1"/>
    <rect x="75" y="39" width="6" height="4" rx="1"/>
    <rect x="75" y="52" width="6" height="4" rx="1"/>
    <rect x="75" y="65" width="6" height="4" rx="1"/>
    <rect x="39" y="27" width="4" height="6" rx="1"/>
    <rect x="52" y="27" width="4" height="6" rx="1"/>
    <rect x="65" y="27" width="4" height="6" rx="1"/>
    <rect x="39" y="75" width="4" height="6" rx="1"/>
    <rect x="52" y="75" width="4" height="6" rx="1"/>
    <rect x="65" y="75" width="4" height="6" rx="1"/>
  </g>

  <!-- chip body -->
  <rect x="33" y="33" width="42" height="42" rx="7"
        fill="url(#chip)" stroke="#5A648C" stroke-width="1.5"/>

  <!-- die -->
  <rect x="41" y="41" width="26" height="26" rx="3.5"
        fill="#2B3150" stroke="#4A5480" stroke-width="1"/>

  <!-- flash bolt -->
  <path d="M63 28 L44 57 L55 57 L46 82 L68 51 L56 51 Z"
        fill="url(#bolt)" stroke="#8A4E00" stroke-opacity="0.4"
        stroke-width="1" stroke-linejoin="round"/>
</svg>
