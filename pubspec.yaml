name: espflash_flutter
description: Android app to flash ESP32-C3 devices over USB, from a local file or URL.
publish_to: 'none'

version: 0.2.0+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management (mirrors happy_flutter)
  flutter_riverpod: ^3.2.0

  # Firmware source: local file picker + URL download
  file_picker: ^11.0.3
  dio: ^5.11.0
  path_provider: ^2.1.6

  # MD5 verification of flashed data (matches ROM SPI_FLASH_MD5)
  crypto: ^3.0.6

  # Keep the screen on during flashing / serial monitoring
  wakelock_plus: ^1.4.0

  # Firmware bundles (.tar.gz) produced by CI
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
